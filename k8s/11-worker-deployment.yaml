# Worker: consumes the parse queue; no inbound traffic, so no Service or readiness gate.
# Liveness reads the heartbeat file that infra/local/worker_entry.py touches from the MAIN loop,
# so a wedged loop is detected (a side thread would keep it fresh and hide the hang).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: occdesk-worker
  namespace: occdesk
  labels: &labels
    app.kubernetes.io/name: occdesk-worker
    app.kubernetes.io/part-of: occurrence-desk
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: occdesk-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: occdesk
      terminationGracePeriodSeconds: 60   # finish the in-flight parse (p99 is about 6s) before exit
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ${REGISTRY}/worker:${IMAGE_TAG}
          envFrom:
            - configMapRef:
                name: occdesk-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["test", "-f", "/tmp/occdesk-worker-heartbeat"]
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'test $(( $(date +%s) - $(stat -c %Y /tmp/occdesk-worker-heartbeat) )) -lt 120'
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
