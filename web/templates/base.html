<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Occurrence Desk{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/console.css">
  <!-- inline so there is no favicon 404 on every page load (it shows up in /metrics too) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232E6FE0'/%3E%3Crect x='8' y='17' width='4' height='7' rx='1.5' fill='white'/%3E%3Crect x='14' y='12' width='4' height='12' rx='1.5' fill='white'/%3E%3Crect x='20' y='7' width='4' height='17' rx='1.5' fill='white'/%3E%3C/svg%3E">
  <!-- htmx is vendored, not fetched from a CDN: the demo has to work with the
       wifi off, and an unreachable script would leave the worklist saying
       "loading" forever. -->
  <script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="masthead">
    <a class="wordmark" href="/console"><span class="dot" aria-hidden="true"></span>Occurrence Desk</a>
    <nav class="tabs" aria-label="Sections">
      <a href="/console"           {% if nav == "worklist" %}aria-current="page"{% endif %}>Worklist</a>
      <a href="/console/dashboard" {% if nav == "dashboard" %}aria-current="page"{% endif %}>Dashboard</a>
      <a href="/console/upload"    {% if nav == "upload" %}aria-current="page"{% endif %}>Upload</a>
      <a href="/docs">API</a>
    </nav>
    <div class="identity">
      <span class="who" id="whoami">Not signed in</span>
      <a href="/console/login" id="signin-link">Sign in</a>
    </div>
  </header>

  <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>

  <script>
  // One place decides how the console holds a token, so no page invents its own.
  const Session = {
    key: "occdesk_token",
    get token() { try { return localStorage.getItem(this.key); } catch { return null; } },
    set token(v) { try { v ? localStorage.setItem(this.key, v) : localStorage.removeItem(this.key); } catch {} },
    claims() {
      const t = this.token;
      if (!t) return null;
      try { return JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); }
      catch { return null; }
    },
    expired() { const c = this.claims(); return !c || (c.exp && c.exp * 1000 <= Date.now()); },
  };

  // Local dev only, and only when we don't already hold a live token: fetch one from
  // /console/dev-session before htmx fires its first "load" trigger, so the very first
  // request out of any fragment already carries a bearer token and no page ever shows
  // a login screen on a local build. The endpoint itself 404s unless APP_ENV=local, so
  // this is a silent no-op everywhere else. A synchronous request is the deliberate
  // choice here — the only way to guarantee this finishes before htmx (loaded with
  // `defer`, so it runs after this inline script but still before DOMContentLoaded)
  // processes the page's hx-trigger="load" elements. It runs once, against one local
  // endpoint that answers instantly, never in a deployed build.
  (function devAutoSignIn() {
    if (Session.token && !Session.expired()) return;
    try {
      const xhr = new XMLHttpRequest();
      xhr.open("GET", "/console/dev-session", false);
      xhr.send();
      if (xhr.status === 200) Session.token = JSON.parse(xhr.responseText).access_token;
    } catch { /* not a local build, or the request failed — the login page still works */ }
  })();

  // Every HTMX request carries the bearer token: the fragments are authenticated
  // exactly like the API they render, so this is not optional decoration.
  document.body.addEventListener("htmx:configRequest", (e) => {
    if (Session.token) e.detail.headers["Authorization"] = `Bearer ${Session.token}`;
  });

  // A token that ages out mid-shift must not look like "no reports".
  document.body.addEventListener("htmx:responseError", (e) => {
    const target = e.detail.target;
    if (e.detail.xhr.status === 401) {
      Session.token = null;
      location.href = "/console/login?next=" + encodeURIComponent(location.pathname);
      return;
    }
    if (target) {
      target.innerHTML =
        '<div class="state-block"><h3>Couldn’t load this</h3>' +
        '<p>The server answered ' + e.detail.xhr.status + '. It will retry on the next refresh.</p>' +
        '<button class="btn secondary" onclick="location.reload()">Reload</button></div>';
    }
  });

  // Pointer users get the whole row; keyboard users get the anchor inside it. Text
  // selection and modifier-clicks are left alone.
  document.addEventListener("click", (e) => {
    const row = e.target.closest?.("tr[data-href]");
    if (!row || e.target.closest("a, button")) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey) return;
    if (window.getSelection()?.toString()) return;
    location.href = row.dataset.href;
  });

  (function identity() {
    const c = Session.claims();
    const who = document.getElementById("whoami");
    const link = document.getElementById("signin-link");
    if (c && !Session.expired()) {
      who.textContent = c.email;
      who.title = c.email + " · " + c.role;
      link.textContent = "Sign out";
      link.href = "#";
      link.onclick = (ev) => { ev.preventDefault(); Session.token = null; location.href = "/console/login"; };
    }
  })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
