{% for r in items %}
<tr>
  <td class="pri {% if r.priority >= 70 %}pri-hi{% elif r.priority >= 40 %}pri-mid{% else %}pri-lo{% endif %}">
    {{ r.priority }}
  </td>
  <td><a href="/console/reports/{{ r.id }}">{{ r.acn }}</a></td>
  <td>{{ r.synopsis or "—" }}
      <a class="muted" href="/console/reports/{{ r.id }}" title="why is this here?">why</a></td>
  <td>{% for h in r.hazards %}<span class="chip">{{ h.label }}</span>{% endfor %}</td>
  <td class="muted">{{ r.report_date or "—" }}</td>
  <td><span class="chip">{{ r.state }}</span></td>
</tr>
{% else %}
<tr><td colspan="6" class="muted">No reports yet. Upload a report set to fill the queue.</td></tr>
{% endfor %}
{% if next_cursor %}
<tr id="more">
  <td colspan="6">
    <button hx-get="/console/fragments/worklist?cursor={{ next_cursor }}"
            hx-target="#more" hx-swap="outerHTML">Load more</button>
  </td>
</tr>
{% endif %}
