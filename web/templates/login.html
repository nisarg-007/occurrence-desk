{% extends "base.html" %}
{% block title %}Sign in &middot; Occurrence Desk{% endblock %}
{% block content %}
<div class="card" style="max-width:26rem">
  <h2 style="margin-top:0;font-size:1rem">Sign in</h2>
  <p>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="username"
           style="width:100%;padding:.5rem;margin-bottom:.5rem">
    <input id="password" type="password" placeholder="password" autocomplete="current-password"
           style="width:100%;padding:.5rem">
  </p>
  <button id="go">Sign in</button>
  <p id="out" class="muted"></p>
</div>

<script>
const API = "{{ api_prefix }}";
const out = document.getElementById("out");
const params = new URLSearchParams(location.search);

async function signIn() {
  out.textContent = "Signing in…";
  const r = await fetch(`${API}/auth/login`, {
    method: "POST",
    headers: {"content-type": "application/json"},
    body: JSON.stringify({
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
    }),
  });
  if (!r.ok) {
    // The API deliberately does not say which half was wrong; the console must not either.
    out.textContent = "Email or password is incorrect.";
    return;
  }
  Session.token = (await r.json()).access_token;
  const next = params.get("next");
  location.href = next && next.startsWith("/console") ? next : "/console";
}

document.getElementById("go").onclick = signIn;
document.getElementById("password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") signIn();
});
</script>
{% endblock %}
